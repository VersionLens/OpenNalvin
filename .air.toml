root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/nalvin"
  args_bin = ["serve"]
  cmd = "env GOFLAGS='-tags=sqlite_fts5' go build -o ./tmp/nalvin ."
  delay = 1000
  exclude_dir = ["tmp", "web/node_modules", "node_modules", "references"]
  exclude_file = [".air.toml", "package.json", "bun.lock"]
  exclude_regex = ["_test\\.go", ".*\\.md$"]
  include_ext = ["go"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = false
